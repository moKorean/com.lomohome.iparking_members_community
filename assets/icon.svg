<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- App icon: an apartment block with a parking sign.

       Deliberately NOT the driver icon. App Store review flagged the two being identical:
       the app icon identifies the app, the driver icon identifies one paired parking lot,
       and one drawing cannot do both jobs. The driver keeps the barrier-and-car line art;
       this says what the app is *for* — parking at the building you live in.

       Not iParking's own logo either, which is what review suggested. This app states in
       every README that it is unaffiliated, and shipping a third party's trademark in a
       published app is the maintainer's decision to make, not a detail to settle in an
       asset file. An original mark says the same thing and carries no such claim.

       Filled dark shapes on transparency, matching the sibling app's published icon.
       Windows and the P counter are holes punched with fill-rule="evenodd", so the icon
       reads correctly on any background Homey puts behind it. No <text> and no external
       font — the P is drawn as a path, so it renders identically everywhere. -->

  <g fill="#111111" fill-rule="evenodd">

    <!-- apartment block: outer silhouette, windows knocked out -->
    <path d="M120 300 q0 -40 40 -40 h300 q40 0 40 40 v560 h-380 z
             M180 340 h70 v70 h-70 z
             M290 340 h70 v70 h-70 z
             M400 340 h70 v70 h-70 z
             M180 450 h70 v70 h-70 z
             M290 450 h70 v70 h-70 z
             M400 450 h70 v70 h-70 z
             M180 560 h70 v70 h-70 z
             M290 560 h70 v70 h-70 z
             M400 560 h70 v70 h-70 z
             M180 670 h70 v70 h-70 z
             M290 670 h70 v70 h-70 z
             M400 670 h70 v70 h-70 z" />

    <!-- ground line the block and the sign share, so they read as one scene -->
    <path d="M96 872 h768 q24 0 24 24 t-24 24 h-768 q-24 0 -24 -24 t24 -24 z" />

    <!-- parking sign: plate with the P as a hole, on a post -->
    <path d="M600 300 q0 -44 44 -44 h216 q44 0 44 44 v304 q0 44 -44 44 h-216 q-44 0 -44 -44 z
             M680 340 v224 h56 v-72 h60 q84 0 84 -76 t-84 -76 z
             M736 404 h58 q30 0 30 32 t-30 32 h-58 z" />
    <path d="M724 648 h56 v224 h-56 z" />
  </g>
</svg>
