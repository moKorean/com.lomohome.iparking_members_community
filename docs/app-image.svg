<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 61 735 514" width="735" height="514">
  <!-- Source for assets/images/{small,large,xlarge}.png (10:7, App Store sizes).

       **This is a crop frame over a photograph, not artwork.** App Store review asked for
       something more specifically representative than an illustration, naming an apartment
       complex parking area; the maintainer supplied `app-image.jpg`, a real iParking
       installation at one. A photograph is what review actually wanted, so the vector scene
       that briefly stood here was dropped — it is in git history if it is ever needed back.

       The crop is expressed as a viewBox rather than as a pre-cropped JPEG so the framing
       stays editable and reviewable: change the four numbers, re-run
       `scripts/make_images.py`, and every size follows. Nothing is hand-cropped per size.

       Framing: the source is 735x631 (ratio 1.165), the store wants 10:7 (1.429), so the
       full width is kept and 117 px come off the height. The window is y 61..575 — the top
       trims sky, the bottom stops just below the installation's red base rather than at the
       image edge, which would have left a band of empty tarmac carrying nothing.

       Note the resolution: 735x514 upscales to 1000x700 for `xlarge`, about 1.36x, so that
       size is a little soft. A larger original would fix it and nothing else would change. -->
  <image xlink:href="app-image.jpg" x="0" y="0" width="735" height="631"/>
</svg>
