<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Source graphic for drivers/visitcar/assets/images/{small,large,xlarge}.png.
       Rasterized by scripts/make_images.py (rsvg-convert) to 75 / 500 / 1000 square.

       **A plain P, on review's own suggestion.** The previous version was an illustration of
       a barrier and a car; App Store review asked for "a simple icon depicting a P (as
       commonly used for parking)" as a cleaner alternative, and they are right — at 75 px,
       which is the size this image is most often seen at, a scene turns to mush while a
       letterform stays a letterform.

       Square with an opaque background, per Homey's driver-image guideline. No <text> and no
       external font: the P is a path, so it rasterizes identically on any machine. -->

  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <rect x="70" y="70" width="860" height="860" rx="170" fill="#e64230"/>

  <!-- P -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M356 168 h214 q186 0 186 176 t-186 176 h-104 v192 h-110 z
           M466 280 v128 h100 q76 0 76 -64 t-76 -64 z" />

  <!-- Painted bay markings, faint and well clear of the letterform. Enough to say
       "parking" rather than "the letter P", low-contrast enough not to compete with it at
       thumbnail size, and the reason the P is set above centre rather than in it. -->
  <g fill="#FFFFFF" opacity="0.22">
    <rect x="170" y="796" width="660" height="20" rx="10"/>
    <rect x="170" y="796" width="20" height="126" rx="10"/>
    <rect x="390" y="796" width="20" height="126" rx="10"/>
    <rect x="590" y="796" width="20" height="126" rx="10"/>
    <rect x="810" y="796" width="20" height="126" rx="10"/>
  </g>
</svg>
