<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Source for drivers/visitcar/assets/images/{small,large,xlarge}.png.
       Rasterized by scripts/make_images.py (rsvg-convert) to 75 / 500 / 1000 square.

       **A frame around iParking's own illustration**, `app_intro_img03.png`, supplied by the
       maintainer. Two of my own drawings stood here before — a barrier-and-car scene, then a
       P built from the logo's letterform — and neither was wanted. Their artwork of their own
       equipment is more specifically representative of this app than anything I can draw.

       Note against App Store review: review asked for "a simple icon depicting a P" here
       *instead of* an illustration, and this is an illustration. It is the maintainer's
       decision, made after seeing the P version. If review raises it again, the P is in git
       history.

       The illustration is a viewBox-framed reference, not a pre-scaled copy: change the
       numbers below, re-run `scripts/make_images.py`, and all three sizes follow. It carries
       an alpha channel and its content runs edge to edge (the faded ghost cars reach x=528),
       so it is placed whole rather than cropped, on an **opaque** background as Homey's
       driver-image guideline requires — 920 px wide inside a 1000 px square, centred, which
       leaves the letterboxing a square target always needs.

       Resolution: 529x406 scaled to 920 wide is a 1.74x upscale, so `xlarge` is soft. That is
       the source's limit, not the frame's; a larger original would fix it and nothing here
       would change. -->

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEFF3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#paper)"/>
  <image xlink:href="app_intro_img03.png" x="40" y="147" width="920" height="706"/>
</svg>
