<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- Device icon: a visitor-parking barrier raised over a car, line art.
       Monochrome strokes on a transparent background, which is what Homey recolours for
       the device tile — a filled/coloured icon reads as a foreign object there. Plain
       shapes only (no <text>, no external font) so it renders identically everywhere. -->
  <style>
    path, rect, line, circle { fill: none; stroke: #000; stroke-linecap: round; stroke-linejoin: round; }
    .o { stroke-width: 40; }
    .d { stroke-width: 26; }
  </style>

  <!-- gate post, with the barrier arm raised: access granted -->
  <line x1="220" y1="300" x2="220" y2="800" class="o"/>
  <line x1="150" y1="800" x2="290" y2="800" class="d"/>
  <path d="M 236 286 L 720 176" class="o"/>
  <line x1="360" y1="258" x2="378" y2="330" class="d"/>
  <line x1="470" y1="233" x2="488" y2="305" class="d"/>
  <line x1="580" y1="208" x2="598" y2="280" class="d"/>

  <!-- car passing under it -->
  <path d="M 420 620 L 462 520 Q 476 486 512 486 L 664 486 Q 700 486 714 520 L 756 620" class="d"/>
  <rect x="392" y="618" width="392" height="120" rx="42" class="o"/>
  <line x1="588" y1="486" x2="588" y2="618" class="d"/>
  <circle cx="474" cy="762" r="46" class="d"/>
  <circle cx="702" cy="762" r="46" class="d"/>
</svg>
